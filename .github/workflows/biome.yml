name: Code quality

# 触发分支：模板原本写的是 master，而本仓库主分支是 main，
# 所以这个工作流此前从未触发过 —— 下面已改成 main。
#
# ⚠️ 这一步目前**不阻断**（与 build.yml 里「类型检查」的那条同一约定）。
#    原因：src/ 现在还没达到 biome ci 的要求。用项目锁定的 2.5.0 实测（266 个文件）：
#
#      Found 32 errors / 9 warnings / 20 infos
#      其中 32 个 error 的构成是：21 个「文件格式与 biome 不一致」
#                              + 11 个「import 顺序不是 biome 想要的」
#      即：**全是风格，零正确性错误**（warnings 里有 noExplicitAny、
#      useOptionalChain 这类建议，但都只是 warning，不构成 error）
#
#    这 32 个都能自动修：跑一次 `pnpm lint`（= biome check --write ./src）即可。
#    但那会一次性重排 21 个文件的格式与 import 顺序，属于独立的一次整理，
#    不在这里顺手做 —— 免得把功能改动和风格改动混进同一个提交。
#    现在留着这一步的意义：让「风格欠债还有多少」每次推送都看得见。
#    哪天跑过 `pnpm lint`，就把 continue-on-error 去掉，让它变成真正的门禁。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 允许手动触发。用得上：本仓库往 main 推提交走的是 GitHub API
  #（见 verify/2026-09-23/API推送.mjs），实测这种推法不会让 push 事件
  # 触发工作流 —— 工作流总运行数一直是 1（唯一那次还是手动派的）。
  # 所以想要结果，得有手动入口。
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # 版本必须与 package.json 里锁定的 @biomejs/biome 一致。
      # 模板原来写的是 latest —— 那样 CI 与本地跑出的规则可能不是同一套，
      # 「本地过了线上红」这类问题就是从这里来的。
      - name: Setup Biome
        uses: biomejs/setup-biome@f382a98e582959e6aaac8e5f8b17b31749018780 # v2.5.0
        with:
          version: 2.5.0

      - name: Run Biome
        run: biome ci ./src --reporter=github
