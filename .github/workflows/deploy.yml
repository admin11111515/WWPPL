name: Deploy to GitHub Pages (manual only)

# ⚠️ 部署通道说明
# 本项目正式部署目标是一个名为 firefly 的 Cloudflare Worker（Worker + 静态资源形态，
# 配置见仓库根 wrangler.jsonc），由 Cloudflare 自己在推送 main 后构建部署，不经过本工作流。
# 本工作流部署到 GitHub Pages，而 GitHub Pages 是纯静态托管、不支持后台接口，
# 且真正提供 /api/* 能力的是 Worker 入口 worker/index.js，GitHub Pages 上必然 404，
# 因此本工作流不自动触发。如需临时用 GitHub Pages 预览纯静态页面，请手动 Run workflow。
on:
  workflow_dispatch:

# Pages 部署需要的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 确保只有一个部署任务同时运行
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.4
          run_install: false
          
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      
      - name: Build site
        run: pnpm run build

      - name: Create .nojekyll file
        run: touch dist/.nojekyll
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist  # Astro默认构建输出目录

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4